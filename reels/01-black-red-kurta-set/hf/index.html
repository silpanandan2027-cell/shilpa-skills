<!doctype html>
<html
  lang="en"
  data-resolution="portrait"
  data-composition-variables='[{"id":"store","type":"string","label":"Store name","default":"Flipkart"},{"id":"cta","type":"string","label":"Call to action","default":"Follow & comment “link”"},{"id":"disclosure","type":"string","label":"Ad disclosure","default":"#ad · AI model, real product"}]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=2160, height=3840" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Great Vibes";
        src: url("assets/fonts/GreatVibes-Regular.ttf") format("truetype");
        font-display: block;
      }
      :root {
        --ground: #f4ece6;
        --pink: #ff69a4;
        --hot: #ec187a;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 2160px; height: 3840px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; }
      #cta {
        position: absolute; left: 0; right: 0; top: 2140px; text-align: center; white-space: nowrap; z-index: 20;
        font-family: "Great Vibes", cursive; font-size: 180px; line-height: 1.2; color: #d6246e;
        -webkit-text-stroke: 5px #ffffff; paint-order: stroke fill;
        text-shadow: 0 0 40px rgba(255, 255, 255, 0.95), 0 0 90px rgba(255, 140, 190, 0.55);
      }
      #cta span { display: inline-block; }
      #disclosure {
        position: absolute; left: 0; right: 0; top: 2400px; text-align: center; z-index: 20;
        font-family: "Poppins", sans-serif; font-weight: 600; font-size: 56px; color: #ffffff;
        -webkit-text-stroke: 6px rgba(60, 25, 35, 0.75); paint-order: stroke fill;
      }
      #leak-host { z-index: 15; }
      #grain-overlay { z-index: 30; }
      @keyframes hf-grain-noise {
        0%, 100% { transform: translate(0, 0); }
        10% { transform: translate(-5%, -5%); }
        20% { transform: translate(-10%, 5%); }
        30% { transform: translate(5%, -10%); }
        40% { transform: translate(-5%, 15%); }
        50% { transform: translate(-10%, 5%); }
        60% { transform: translate(15%, 0); }
        70% { transform: translate(0, 10%); }
        80% { transform: translate(-15%, 0); }
        90% { transform: translate(10%, 5%); }
      }
      #grain-overlay .grain-texture {
        position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
        background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        opacity: 0.07;
        animation: hf-grain-noise 0.5s steps(1) infinite;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="15.4" data-width="2160" data-height="3840">
      <!-- scenes, back to back -->
      <div id="intro" data-composition-id="intro" data-composition-src="compositions/intro.html"
        data-start="0" data-duration="2.8" data-track-index="0" data-track-kind="graphics" data-width="2160" data-height="3840"
        data-variable-values='{"store":"Flipkart"}'></div>
      <div id="look" data-composition-id="look" data-composition-src="compositions/look.html"
        data-start="2.8" data-duration="5" data-track-index="0" data-track-kind="graphics" data-width="2160" data-height="3840"></div>
      <div id="details" data-composition-id="details" data-composition-src="compositions/details.html"
        data-start="7.8" data-duration="4.2" data-track-index="0" data-track-kind="graphics" data-width="2160" data-height="3840"></div>
      <div id="finale" data-composition-id="finale" data-composition-src="compositions/finale.html"
        data-start="12" data-duration="3.4" data-track-index="0" data-track-kind="graphics" data-width="2160" data-height="3840"></div>

      <!-- warm light leak as she first appears -->
      <div id="organic-light-leak-overlay" data-composition-id="organic-light-leak-overlay"
        data-composition-src="compositions/organic-light-leak-overlay.html"
        data-start="2.6" data-duration="3" data-track-index="1" data-track-kind="graphics" data-width="2160" data-height="3840"></div>

      <!-- call to action and disclosure over the last two thirds -->
      <div id="cta" class="clip" data-start="8" data-duration="7.4" data-track-index="2" data-layout-allow-overlap>
        <span>F</span><span>o</span><span>l</span><span>l</span><span>o</span><span>w</span><span>&nbsp;</span><span>&amp;</span><span>&nbsp;</span><span>c</span><span>o</span><span>m</span><span>m</span><span>e</span><span>n</span><span>t</span><span>&nbsp;</span><span>“</span><span>l</span><span>i</span><span>n</span><span>k</span><span>”</span>
      </div>
      <div id="disclosure" class="clip" data-start="2.8" data-duration="12.6" data-track-index="3" data-var-text="disclosure">#ad · AI model, real product</div>

      <div id="grain-overlay" style="position: absolute; inset: 0; pointer-events: none" data-layout-ignore><div class="grain-texture"></div></div>

      <!-- sound on the visible actions -->
      <audio id="sfx-sparkle-1" class="clip" src="assets/sfx/sparkle.mp3" data-start="0.45" data-duration="1.6" data-track-index="4" data-volume="0.6"></audio>
      <audio id="sfx-whoosh-intro" class="clip" src="assets/sfx/whoosh.mp3" data-start="2.4" data-duration="0.57" data-track-index="5" data-volume="0.7"></audio>
      <audio id="sfx-switch-1" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="4.33" data-duration="0.8" data-track-index="4" data-volume="0.8"></audio>
      <audio id="sfx-switch-2" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="5.98" data-duration="0.8" data-track-index="4" data-volume="0.8"></audio>
      <audio id="sfx-sparkle-2" class="clip" src="assets/sfx/sparkle.mp3" data-start="8.1" data-duration="1.6" data-track-index="4" data-volume="0.55"></audio>
      <audio id="sfx-whip" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="9.62" data-duration="0.8" data-track-index="5" data-volume="0.7"></audio>
      <audio id="sfx-pop" class="clip" src="assets/sfx/pop.mp3" data-start="10.05" data-duration="0.6" data-track-index="4" data-volume="0.8"></audio>
      <audio id="sfx-switch-3" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="13.43" data-duration="0.8" data-track-index="4" data-volume="0.8"></audio>
      <audio id="sfx-chime" class="clip" src="assets/sfx/chime.mp3" data-start="14.0" data-duration="1.4" data-track-index="5" data-volume="0.5"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.to({}, { duration: 15.4 }, 0);
      tl.fromTo("#cta span", { opacity: 0, y: 24, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.22, ease: "power3.out", stagger: 0.04 }, 8.1);
      tl.fromTo("#disclosure", { opacity: 0 }, { opacity: 0.95, duration: 0.4, ease: "power2.out" }, 3.0);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
